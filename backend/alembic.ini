# ============================================================
# CivicLens Core — Alembic Configuration
# Part 1
# ============================================================

[alembic]

# Location of Alembic migration scripts.
# %(here)s refers to the directory containing this alembic.ini file.
script_location = %(here)s/alembic

# Add the backend directory to Python's import path.
# This allows Alembic to import:
#   app.db.session
#   app.models
#   app.core
prepend_sys_path = .

# Migration file naming format.
# Example:
#   0001_initial.py
#   0002_add_notifications.py
#
# Keeping timestamps out of filenames makes the migration
# history deterministic and easy to understand.
file_template = %%(rev)s_%%(slug)s


# ============================================================
# Database URL
# ============================================================
#
# The actual database URL is supplied through the
# DATABASE_URL environment variable.
#
# Example:
#
# DATABASE_URL=postgresql+psycopg://civiclens:civiclens@db:5432/civiclens
#
# The application Alembic environment file
# (backend/alembic/env.py) reads DATABASE_URL.
#
# This placeholder prevents Alembic from depending on a
# hard-coded production database credential.
sqlalchemy.url =


# ============================================================
# Logging
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# ============================================================
# CivicLens Migration Notes
# ============================================================
#
# Part 1:
# - PostgreSQL is the transactional source of truth.
# - PostGIS is used for geospatial capabilities.
# - Alembic manages schema migrations.
# - DATABASE_URL is supplied through the environment.
#
# Part 2:
# - Future AI-related tables/data stores should not be added
#   casually to the transactional schema.
# - AI, model, vector, training and analytics infrastructure
#   should remain appropriately separated from the core
#   transactional database design.
#
# Never place passwords, API keys, JWT secrets, or other
# credentials directly in this file.
#
# ============================================================